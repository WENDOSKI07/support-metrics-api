services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${PGUSER:?Define PGUSER en .env}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Define PGPASSWORD en .env}
      POSTGRES_DB: ${PGDATABASE:?Define PGDATABASE en .env}
    ports:
      - "127.0.0.1:${PGPORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
