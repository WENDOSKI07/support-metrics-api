<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Iniciar sesión · Support Metrics</title><link rel="stylesheet" href="/style.css"><script src="/login.js" defer></script></head>
<body class="login-page"><main class="login-card">
<a class="brand" href="/login"><span class="brand-mark" aria-hidden="true">S</span>Support Metrics</a>
<p class="login-eyebrow">TU ESPACIO DE SOPORTE</p><h1>Retoma la conversación.</h1><p class="muted">Consulta tus solicitudes y sigue cada solución desde un solo lugar.</p>
<form id="login-form"><label for="username">Usuario</label><input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required minlength="3" maxlength="64" pattern="[a-z0-9._\-]{3,64}" aria-describedby="user-help"><small id="user-help" class="muted">El usuario asignado por el administrador.</small>
<label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" required minlength="15" maxlength="256">
<p id="login-error" role="alert"></p><button class="primary" type="submit">Iniciar sesión</button></form>
<p class="login-footnote">¿Necesitas acceso? Contacta al administrador de este espacio.</p>
</main></body></html>
